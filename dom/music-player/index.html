<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="main">
      <div id="left"></div>
      <div id="right">
        <h3>All songs</h3>
        <div id="all-songs">
          <div class="song-card">
            <div class="part-1">
              <img
                src="https://images.unsplash.com/photo-1564180442288-886acde3523b?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8bXVzaWMlMjBjb3ZlcnxlbnwwfHwwfHx8MA%3D%3D"
                alt=""
              />
              <h2>Song name</h2>
            </div>
            <h6>3:45</h6>
          </div>
        </div>
      </div>
    </div>
    <div id="player">
      <h3 id="backward"><i class="ri-skip-back-mini-fill"></i></h3>
      <h3 id="play"><i class="ri-play-fill"></i></h3>

      <h3 id="forward"><i class="ri-skip-forward-mini-fill"></i></h3>
    </div>
    <script src="script.js"></script>
  </body>
</html>
